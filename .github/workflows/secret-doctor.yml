name: secret-doctor

# Proves a repository secret's VALUE actually arrived — not merely that a secret
# with that name exists.
#
# GitHub never returns a secret value through the API. `gh secret list` shows only
# names and timestamps, so it cannot distinguish "set correctly" from "set to the
# empty string" or "set to the wrong thing". That ambiguity is exactly what made
# five consecutive failed attempts look indistinguishable from success.
#
# The only honest end-to-end check is a round trip: push a known nonce, have the
# runner hash it, and compare the hash locally. GitHub masks the secret itself in
# logs but not its SHA-256, so the digest is safe to print.
#
# Runs in ~15s and needs no JDK.

on:
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hash the canary
        env:
          CANARY: ${{ secrets.APPFACTORY_CANARY }}
        run: |
          if [ -z "$CANARY" ]; then
            echo "::error::APPFACTORY_CANARY is empty or unset on the runner."
            echo "verdict=ABSENT" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # printf, not echo -- a trailing newline would change the digest and make
          # a correctly-delivered secret look wrong.
          DIGEST=$(printf '%s' "$CANARY" | sha256sum | cut -d' ' -f1)
          echo "len=${#CANARY}"
          echo "sha256=$DIGEST"
          {
            echo "### secret-doctor"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| length | ${#CANARY} |"
            echo "| sha256 | \`$DIGEST\` |"
          } >> "$GITHUB_STEP_SUMMARY"

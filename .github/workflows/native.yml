name: native

# Builds llama.cpp for Android, ONCE per pinned upstream commit.
#
# MEASURED, on ubuntu-latest, llama.cpp b10435, NDK 29.0.14206865:
#
#   arm64-v8a   229s     11 shared libraries    172 MB unstripped -> 19 MB stripped
#   x86_64      221s     (same shape)
#
# The two run in parallel, so about four minutes of wall clock for both. Those figures
# predate building upstream's JNI layer, which adds libai-chat.so.
#
# WHY THIS IS NOT PART OF ci.yml -- restated against that measurement
#
# The original reasoning here was that llama.cpp is a large C++ tree and "not a
# three-minute job". That was an intuition, and the first run of this workflow existed
# to replace it with a number. The number came back at the fast end -- 229s, not the
# 40 minutes it could have been -- so the original argument does not hold as stated.
#
# The decision survives on a narrower and now-quantified basis: inside a Gradle build
# the two ABIs are built one after another, so this is roughly 7.5 minutes ADDED to a
# 3-minute inner loop, on every push, to rebuild a library that changes only when
# native/llama.cpp.pin changes. Tripling the loop is the cost; the benefit is zero on
# every commit that does not touch the pin.
#
# Keeping the honest version of that reasoning matters more than the conclusion: the
# same argument would have justified a 40-minute build, and it should not have.
#
# NO -march FLAG, DELIBERATELY -- and the mechanism is worth stating precisely, because
# the first version of this comment got it half right. It is not that llama.cpp picks
# kernels at runtime inside one binary; it is that GGML_BACKEND_DL and
# GGML_CPU_ALL_VARIANTS build SEVEN separate CPU backends -- armv8.0 through armv9.2 --
# each its own .so, and the right one is loaded at runtime from the detected CPU. That
# dispatch has to be switched on, and once it is, baking in an ISA would be both
# redundant and a SIGILL on any older phone in the cohort.

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/llama.cpp.pin'
      - '.github/workflows/native.yml'

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # Both, on purpose. arm64-v8a is every real device; x86_64 is the emulator
        # rung, which is the ONLY rung that answers "does it launch". An arm64-only
        # library would leave that rung green while never once loading the native
        # code -- coverage that reports success and verifies nothing.
        abi: [arm64-v8a, x86_64]

    steps:
      - uses: actions/checkout@v4

      - name: Read the pin
        id: pin
        run: |
          # Fail loudly on a malformed pin rather than silently building master.
          COMMIT=$(sed -n 's/^commit *= *//p' native/llama.cpp.pin | tr -d ' \r')
          TAG=$(sed -n 's/^tag *= *//p' native/llama.cpp.pin | tr -d ' \r')
          if ! printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::native/llama.cpp.pin has no 40-character commit sha; refusing to guess."
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "building llama.cpp $TAG ($COMMIT) for ${{ matrix.abi }}"

      - name: Check out llama.cpp at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ steps.pin.outputs.commit }}
          path: llama.cpp
          fetch-depth: 1

      - name: Report the toolchain actually used
        id: tools
        run: |
          # The .so is a function of (source commit, NDK, flags). Two of those three
          # are supplied by the runner image and move without notice, so they are
          # recorded rather than assumed -- otherwise a library that stops working is
          # undiagnosable, because nothing says what built it.
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          [ -n "$NDK" ] || { echo "::error::No Android NDK on this runner."; exit 1; }
          VER=$(sed -n 's/^Pkg.Revision *= *//p' "$NDK/source.properties" | tr -d ' \r')
          echo "ndk=$NDK"       >> "$GITHUB_OUTPUT"
          echo "ndkver=$VER"    >> "$GITHUB_OUTPUT"
          echo "NDK $VER at $NDK"
          cmake --version | head -1

      - name: Configure
        run: |
          # THESE FLAGS ARE ADOPTED, NOT DERIVED.
          #
          # The first attempt at this file assembled a plausible flag set by reading
          # option names out of the root CMakeLists. It failed on the first build:
          # LLAMA_BUILD_APP defaults to ON for a standalone build, so the unified
          # binary was compiled and died on a missing build-info.h. Every flag chosen
          # was defensible; the combination had never been built. Same failure class
          # as deriving a version lattice from package metadata.
          #
          # So this is upstream's own Android configuration, from
          # examples/llama.android/lib/build.gradle.kts at the pinned commit -- the
          # one combination that is known to produce a working Android library.
          #
          # The two that matter most, and that a hand-rolled set would never guess:
          #
          #   GGML_BACKEND_DL + GGML_CPU_ALL_VARIANTS
          #     builds every CPU variant as a SEPARATELY LOADABLE backend, chosen at
          #     runtime from the detected CPU. This is why no -march flag belongs
          #     here: dispatch is a load-time decision, not a compile-time one, and
          #     baking in an ISA would SIGILL on an older phone in the cohort.
          #     It also means the build emits MANY .so files, all of which must ship.
          #
          #   GGML_CPU_KLEIDIAI (arm64 only)
          #     Arm's optimised kernels. Upstream turns it on for arm64-v8a and off
          #     for x86_64, along with OpenMP -- which is ON for arm64 here, the
          #     opposite of what the generic Android docs say.
          #
          # THE SOURCE DIRECTORY IS UPSTREAM'S ANDROID CMakeLists, NOT llama.cpp's ROOT,
          # and that single choice is what actually fixed the first failure.
          #
          # LLAMA_STANDALONE is (CMAKE_SOURCE_DIR STREQUAL CMAKE_CURRENT_SOURCE_DIR),
          # and LLAMA_BUILD_APP / TOOLS / TESTS / EXAMPLES / SERVER all default to it.
          # Configuring llama.cpp as the TOP-LEVEL project therefore turns all of them
          # ON, which is why the unified binary was being built and dying on a missing
          # build-info.h. Upstream never hits it because they always add_subdirectory()
          # llama.cpp beneath their own project -- so LLAMA_STANDALONE is OFF and every
          # one of those defaults to OFF without a flag.
          #
          # Passing -DLLAMA_BUILD_APP=OFF by hand would also have worked, and would
          # have left the same trap set for the next person. Building the way upstream
          # builds removes the trap instead of stepping around it.
          #
          # It also produces libai-chat.so, the JNI layer, whose exported symbols are
          # Java_com_arm_aichat_internal_InferenceEngineImpl_* -- so the Kotlin that
          # calls it must live in that package. That is a reason to vendor upstream's
          # Kotlin unmodified rather than rewrite it under our own package name.
          #
          # Their CMakeLists sets GGML_SYSTEM_ARCH, GGML_CPU_KLEIDIAI and GGML_OPENMP
          # itself from ANDROID_ABI, so those are NOT passed here. The flags below are
          # exactly the argument list from examples/llama.android/lib/build.gradle.kts.
          #
          # ANDROID_PLATFORM stays at 28, this app's minSdk, though upstream's own
          # module declares minSdk 33. Measured: it builds at 28, so embedded mode does
          # not cost us the API 28-32 devices.
          cmake -S llama.cpp/examples/llama.android/lib/src/main/cpp -B build \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.tools.outputs.ndk }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_COMMON=ON \
            -DLLAMA_OPENSSL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_LLAMAFILE=OFF

      - name: Build, and time it
        id: build
        run: |
          start=$(date +%s)
          cmake --build build --config Release -j"$(nproc)"
          end=$(date +%s)
          echo "seconds=$(( end - start ))" >> "$GITHUB_OUTPUT"

      - name: Collect the shared libraries, stripped and unstripped
        id: collect
        run: |
          mkdir -p "out/${{ matrix.abi }}" "symbols/${{ matrix.abi }}"
          # find, not a fixed path: ggml splits into several .so files whose names and
          # locations have changed upstream more than once, and a hardcoded list would
          # silently ship a subset. With GGML_CPU_ALL_VARIANTS there are eleven of
          # them, seven being per-ISA CPU backends. An empty result is an error.
          found=$(find build -name '*.so' -type f | sort)
          if [ -z "$found" ]; then
            echo "::error::The build produced no .so files."
            exit 1
          fi
          # The JNI layer specifically. Everything else is an engine the app never
          # calls directly, so a build that quietly produced only those would look
          # successful and ship an app that cannot reach llama.cpp at all.
          if ! printf '%s\n' "$found" | grep -q 'libai-chat\.so$'; then
            echo "::error::libai-chat.so is absent -- the JNI layer did not build."
            printf '%s\n' "$found"
            exit 1
          fi
          printf '%s\n' "$found" | while read -r so; do
            cp "$so" "symbols/${{ matrix.abi }}/"
            cp "$so" "out/${{ matrix.abi }}/"
          done

          # STRIP, and keep the symbols separately. Measured: 172 MB -> 19 MB, so this
          # is not a tidy-up, it is the difference between a 22 MB app and a 175 MB one.
          #
          # The unstripped copies are kept for the same reason release.yml keeps R8's
          # mapping.txt: a native crash report from a stripped library is a list of
          # hex addresses, and the symbols to resolve them exist only at build time.
          # Discarding them makes every future native crash undiagnosable.
          STRIP="${{ steps.tools.outputs.ndk }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          [ -x "$STRIP" ] || { echo "::error::llvm-strip not found at $STRIP"; exit 1; }
          find "out/${{ matrix.abi }}" -name '*.so' -exec "$STRIP" --strip-unneeded {} +

          ( cd "out/${{ matrix.abi }}" && sha256sum ./* > ../SHA256SUMS-${{ matrix.abi }}.txt )
          cat "out/SHA256SUMS-${{ matrix.abi }}.txt"

          n=$(printf '%s\n' "$found" | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "stripped=$(du -sb "out/${{ matrix.abi }}" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "unstripped=$(du -sb "symbols/${{ matrix.abi }}" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the libraries that ship
        uses: actions/upload-artifact@v4
        with:
          name: llama-${{ steps.pin.outputs.tag }}-${{ matrix.abi }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Upload the symbols that make a native crash readable
        uses: actions/upload-artifact@v4
        with:
          name: llama-${{ steps.pin.outputs.tag }}-${{ matrix.abi }}-symbols
          path: symbols/
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.abi }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| llama.cpp | \`${{ steps.pin.outputs.tag }}\` |"
            echo "| NDK | ${{ steps.tools.outputs.ndkver }} |"
            echo "| build time | **${{ steps.build.outputs.seconds }}s** |"
            echo "| libraries | ${{ steps.collect.outputs.count }} |"
            echo "| ships (stripped) | **${{ steps.collect.outputs.stripped }}** bytes |"
            echo "| symbols kept | ${{ steps.collect.outputs.unstripped }} bytes |"
            echo ""
            echo "Both numbers decide something. Build time decides whether this can"
            echo "ever live in the push loop; stripped size is what every device"
            echo "downloads, before a single byte of model."
          } >> "$GITHUB_STEP_SUMMARY"

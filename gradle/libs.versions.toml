# Pinned, known-good matrix. AGP / Kotlin / KSP / Compose form a tight compatibility
# lattice -- KSP in particular is pinned to an exact Kotlin version (2.0.0-1.0.21 means
# "KSP 1.0.21 for Kotlin 2.0.0") and will refuse to load against any other.
#
# Nothing here is a range or a `+`. An unpinned version turns a green build into a
# time bomb that detonates on someone else's machine, months later.
#
# This exact set is proven: it is what CI compiled successfully for ColdForge.

[versions]
agp = "9.0.0"
kotlin = "2.3.0"
ksp = "2.3.4"

coreKtx = "1.15.0"
lifecycle = "2.10.0"
activityCompose = "1.9.3"
composeBom = "2025.09.01"

hilt = "2.59"
hiltNavCompose = "1.2.0"
# Navigation Compose is DECLARED EXPLICITLY even though hilt-navigation-compose
# already drags it onto the classpath transitively. This repo has been bitten by
# exactly that shape twice -- material-icons-core stopped being transitive from
# material3, and kotlinx-serialization-json arrived only via ktor -- so a symbol
# the source imports directly gets its own line. Preflight check 050 enforces it:
# it maps `import androidx.navigation.compose.*` to a required
# `navigation-*compose` artifact and fails the run when one is missing.
#
# 2.9.8 is the newest STABLE. 2.10.0 exists only as rc01, and nothing here is
# ever a pre-release for the same reason nothing here is a range.
navigationCompose = "2.9.8"
room = "2.8.3"
# androidx.sqlite bundled: Google-first-party bundled SQLite, so FTS5 is
# available regardless of the device's system SQLite (which does not compile
# FTS5 in on many builds -- API 36 emulator failed with "no such module: fts5"
# on run 31922969687). Uses the new driver API (SQLiteConnection /
# BundledSQLiteDriver), not SQLiteOpenHelper.
sqliteBundled = "2.7.0"
serialization = "1.8.0"
# Ktor CLIENT. The app talks to llama-server over loopback; it is not a server itself.
# CIO engine: coroutine-native, no thread-per-connection, which matters on a phone.
ktor = "2.3.11"

junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.6.1"
androidxTestRunner = "1.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
# Declared explicitly. Using androidx.lifecycle.compose.* with only lifecycle-runtime-ktx
# on the classpath produced 1 root error and 4 cascade errors in ColdForge.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
# Icons are NOT transitive from material3 any more. ChatScreen imports
# androidx.compose.material.icons.{Icons, automirrored.filled.Send}, which used to
# arrive for free under Compose BOM 2024.04 and does not under later ones.
# Version comes from the BOM.
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
# NavHost under test needs a NavController the test can drive and assert on.
# navigation-testing supplies TestNavHostController; without it an instrumented
# test can only observe what happened to be rendered, not which route is current.
androidx-navigation-testing = { group = "androidx.navigation", name = "navigation-testing", version.ref = "navigationCompose" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Bundled SQLite driver. Ships FTS5 inside the app so the device's system
# SQLite (which may or may not compile FTS5 in) is not relied on.
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqliteBundled" }

# Explicit. ColdForge got this transitively via ktor-serialization and would have
# broken the moment ktor was dropped.
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
